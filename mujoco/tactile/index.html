                <h1 id="_1">力传感器测量接触力</h1>
<h2 id="1">1. 力传感器的类型与测量原理</h2>
<p>MuJoCo 提供两类共 6 种力传感器，覆盖从简单碰撞检测到复杂多体动力学分析的全场景需求。传感器类型在include/mujoco/mjmodel.h中定义，核心参数包括测量维度、数据类型和噪声特性。</p>
