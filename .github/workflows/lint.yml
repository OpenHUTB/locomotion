name: lint

on:
  push:
    branches: [ "master", "dev" ]
  pull_request:
    branches: [ "master", "dev" ]

permissions:
  contents: read

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3
    - name: Set up Python 3.10
      uses: actions/setup-python@v4
      with:
        python-version: "3.10"
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        # Pin the ruleset so CI results do not change when Ruff adds defaults.
        pip install "ruff==0.15.22"
    - name: Test with ruff
      run: |
        ruff check flybody/ qflex_benchmark/plot/ qflex_benchmark/setup/patch_persistence.py
